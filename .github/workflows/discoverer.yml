name: Update Groups List

concurrency:
  group: generated-data
  cancel-in-progress: false

on:
  schedule:
    # Запуск 1-го числа каждого месяца в 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Возможность запустить вручную из интерфейса GitHub

jobs:
  discover:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx beautifulsoup4
      - name: Download latest generated data
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/data/auditories.json" -o data/auditories.json \
            || curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/auditories.json" -o data/auditories.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/data/groups.json" -o data/groups.json \
            || curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/groups.json" -o data/groups.json
      - run: python discoverer.py
      - name: Publish generated data without history
        run: bash .github/scripts/publish-generated-data.sh