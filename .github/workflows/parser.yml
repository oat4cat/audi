name: RUZ Auditories Parser

on:
  schedule:
    # 01:00 UTC == 04:00 по МСК
    - cron: '0 1 * * *'
  workflow_dispatch: # Позволяет запускать парсер вручную кнопкой Run Workflow из интерфейса GitHub

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Parser
        run: python parser.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auditories.json
          git commit -m "auto: update free auditories schedule" || exit 0
          git push